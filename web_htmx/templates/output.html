{% extends "base.html" %}

{% block content %}
  {% if initial_msg %}
    <div class="flash ok">{{ initial_msg }}</div>
  {% endif %}
  {% if initial_err %}
    <div class="flash err">{{ initial_err }}</div>
  {% endif %}

  <div
    id="output-root"
    hx-get="/output/root"
    hx-trigger="load"
    hx-swap="outerHTML">
    <div class="card">Caricamento output...</div>
  </div>
{% endblock %}
