{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:480px;margin:30px auto">
  <h2>Cambia password</h2>

  {% if error %}
    <div class="flash err">{{ error }}</div>
  {% endif %}

  <form method="post" action="/password">
    <input type="hidden" name="_csrf"
           value="{{ request.state.csrf_token }}">

    <label>Password attuale</label>
    <input type="password" name="old_password"
           autocomplete="current-password" required>

    <label>Nuova password</label>
    <input type="password" name="new_password"
           minlength="12" maxlength="128"
           autocomplete="new-password" required>

    <label>Ripeti nuova password</label>
    <input type="password" name="confirm_password"
           minlength="12" maxlength="128"
           autocomplete="new-password" required>

    <div class="row-actions">
      <button class="primary" type="submit">Aggiorna password</button>
    </div>
  </form>
</div>
{% endblock %}
